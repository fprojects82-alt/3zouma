name: Flutter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: bash scripts/setup_platforms.sh

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: |
          set +e
          flutter analyze --format=machine 2> analyze.txt
          code=$?
          root="$PWD/"
          awk -F'|' -v root="$root" 'NF>=8 {
            sev=$1; file=$4; sub(root, "", file);
            level = (sev=="ERROR") ? "error" : (sev=="WARNING") ? "warning" : "notice";
            msg=$8; for (i=9;i<=NF;i++) msg=msg "|" $i;
            printf "::%s file=%s,line=%s,col=%s::%s %s\n", level, file, $5, $6, $3, msg
          }' analyze.txt
          echo "Analyzer issues: $(grep -c '|' analyze.txt)"
          exit $code

      - name: Test
        if: always()
        run: flutter test --reporter github

  build-android:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: bash scripts/setup_platforms.sh

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: ozouma-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
