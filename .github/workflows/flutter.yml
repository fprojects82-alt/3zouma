name: Flutter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: bash scripts/setup_platforms.sh

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: |
          set +e
          dart analyze --format=machine --fatal-infos > analyze.txt 2>&1
          code=$?
          python3 scripts/ci_report.py analyze analyze.txt "$PWD/"
          exit $code

      - name: Test
        if: always()
        run: |
          set +e
          flutter test --reporter json > test.json
          code=$?
          python3 scripts/ci_report.py test test.json
          exit $code

  build-android:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: bash scripts/setup_platforms.sh

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: ozouma-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
